name: Update profile cards

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-cards

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Render profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 render_card.py
      - name: Commit changed cards
        run: |
          git add assets/profile-dark.svg assets/profile-light.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh profile statistics"
            git push
          fi
